<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luckfox 雙流對講終端</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 640px; margin: auto; }
        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
        video { width: 100%; height: 100%; object-fit: contain; }
        button { width: 100%; padding: 20px; margin-top: 20px; border-radius: 50px; border: none; background: #2ecc71; color: white; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.98); background: #27ae60; }
        #logs { font-size: 12px; color: #2ed573; margin-top: 20px; text-align: left; background: #000; padding: 15px; height: 150px; overflow-y: auto; border: 1px solid #444; font-family: monospace; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <h2>Luckfox 監控 & 對講</h2>
    <div class="video-box"><video id="video" autoplay playsinline muted></video></div>
    <button id="btnStart">啟動雙向監控與對講</button>
    <div id="logs">>> 系統準備就緒，請按啟動</div>
</div>

<script>
    // 請確認 ngrok 網址
    const SERVER_URL = "https://be9c2484fae9.ngrok-free.app"; 
    const videoEl = document.getElementById('video');
    const btnStart = document.getElementById('btnStart');
    const logEl = document.getElementById('logs');

    function addLog(msg) {
        const time = new Date().toLocaleTimeString();
        logEl.innerHTML += `<br>[${time}] ${msg}`;
        logEl.scrollTop = logEl.scrollHeight;
    }

    async function start() {
        btnStart.disabled = true;
        addLog("正在初始化雙流連線...");

        // --- 1. 影像連線 (只接收) ---
        try {
            const pcVideo = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            pcVideo.addTransceiver('video', { direction: 'recvonly' });
            
            pcVideo.ontrack = (e) => {
                if (e.track.kind === 'video') {
                    videoEl.srcObject = e.streams[0];
                    addLog("影像流已連接 ✅");
                }
            };

            const offerV = await pcVideo.createOffer();
            await pcVideo.setLocalDescription(offerV);
            
            const resV = await fetch(`${SERVER_URL}/api/webrtc?src=pet2`, { method: 'POST', body: offerV.sdp });
            const answerV = await resV.text();
            await pcVideo.setRemoteDescription({ type: 'answer', sdp: answerV });
        } catch (e) {
            addLog("影像連線失敗: " + e.message);
        }

        // --- 2. 音訊連線 (發送麥克風) ---
        try {
            const pcAudio = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            
            // 強制設定採樣率與 Luckfox 的 aplay 一致 (16000Hz)
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: {
                    sampleRate: 16000,
                    channelCount: 1,
                    echoCancellation: true,
                    noiseSuppression: true
                } 
            });

            stream.getTracks().forEach(track => pcAudio.addTrack(track, stream));
            addLog("麥克風權限已取得，採樣率 16kHz");

            const offerA = await pcAudio.createOffer();
            await pcAudio.setLocalDescription(offerA);

            // 等待 ICE 收集，避免 EOF 斷流
            addLog("正在優化音訊傳輸路徑...");
            await new Promise(r => setTimeout(r, 1200));

            const resA = await fetch(`${SERVER_URL}/api/webrtc?src=pet2_mic`, { 
                method: 'POST', 
                body: pcAudio.localDescription.sdp 
            });

            const answerA = await resA.text();
            await pcAudio.setRemoteDescription({ type: 'answer', sdp: answerA });
            addLog("對講通道已建立！請開始說話 🎤");

        } catch (e) {
            addLog("音訊連線失敗: " + e.message);
            btnStart.disabled = false;
        }
    }

    btnStart.addEventListener('click', start);
</script>
</body>
</html>
