<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Luckfox Pro 遠端監控</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #eee; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #status { font-size: 14px; color: #aaa; margin: 15px 0; padding: 10px; background: #2a2a2a; border-radius: 8px; }
        .btn { width: 100%; padding: 18px; font-size: 18px; font-weight: bold; border-radius: 10px; border: none; cursor: pointer; margin-top: 10px; }
        .btn-video { background: #28a745; color: white; }
        .btn-audio { background: #007bff; color: white; transition: 0.3s; }
        .btn-audio:disabled { background: #444; color: #888; cursor: not-allowed; }
        .recording { background: #dc3545 !important; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.8; } }
    </style>
</head>
<body>
    <div class="container">
        <h3>Luckfox 4G 監控系統</h3>
        <video id="v" autoplay playsinline muted controls></video>
        <div id="status">準備就緒 (請點擊啟動)</div>

        <button class="btn btn-video" id="connBtn" onclick="startConnect()">1. 啟動遠端影像</button>
        <button class="btn btn-audio" id="micBtn" onclick="toggleMic()" disabled>2. 按住對講</button>
    </div>

    <script>
        const SVR = "https://ddca383457d7.ngrok-free.app";
        let pc;
        let mediaRecorder;

        async function startConnect() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "連線中 (強制中繼模式)...";
            
            const config = {
                iceServers: [
                    { urls: "stun:stun.l.google.com:19302" },
                    { 
                        urls: "turn:global.metered.ca:443?transport=tcp", 
                        username: "4d22e5629ba194c9fe1ddb7c", 
                        credential: "OYETGRsl0a/CO0wc" 
                    }
                ],
                iceCandidatePoolSize: 10
                //iceTransportPolicy: "relay" // 強制走 TURN 伺服器，解決 4G checking 問題
            };

            pc = new RTCPeerConnection(config);

            pc.oniceconnectionstatechange = () => {
                const state = pc.iceConnectionState;
                statusDiv.innerText = "狀態: " + state;
                if (state === "connected" || state === "completed") {
                    statusDiv.style.color = "#28a745";
                    document.getElementById('micBtn').disabled = false;
                }
                if (state === "failed") {
                    statusDiv.style.color = "#dc3545";
                    statusDiv.innerText = "連線失敗，請重新整理網頁";
                }
            };

            pc.ontrack = (e) => {
                document.getElementById('v').srcObject = e.streams[0];
            };

            pc.addTransceiver('video', { direction: 'recvonly' });

            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                const res = await fetch(`${SVR}/api/webrtc?src=pet2`, {
                    method: 'POST',
                    body: offer.sdp
                });
                const answer = await res.text();
                await pc.setRemoteDescription({ type: 'answer', sdp: answer });
            } catch (err) {
                statusDiv.innerText = "API 錯誤: " + err.message;
            }
        }

        async function toggleMic() {
            const btn = document.getElementById('micBtn');
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                btn.innerText = "2. 按住對講";
                btn.classList.remove('recording');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = async (e) => {
                    if (e.data.size > 0) {
                        fetch(`${SVR}/upload_audio`, { method: 'POST', body: e.data });
                    }
                };
                mediaRecorder.start(200); 
                btn.innerText = "對講中 (點擊停止)";
                btn.classList.add('recording');
            } catch (err) {
                alert("錄音啟動失敗，請確認已使用 HTTPS 網址。");
            }
        }
    </script>
</body>
</html>
