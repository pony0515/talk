<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Luckfox Pro 遠端監控</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; text-align: center; padding: 20px; }
        video { width: 100%; max-width: 500px; background: #000; border-radius: 12px; }
        input { width: 80%; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .btn { padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 8px; border: none; margin: 5px; }
        .btn-video { background: #28a745; color: white; }
        .btn-audio { background: #007bff; color: white; }
        #status { color: #ffca28; margin: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <h3>🚀 Luckfox 遠端監控</h3>
    
    <input type="text" id="urlInput" placeholder="輸入 ngrok 網址 (如 https://xxx.ngrok-free.app)">
    
    <video id="v" autoplay playsinline muted controls></video>
    <div id="status">準備就緒</div>

    <button class="btn btn-video" onclick="connect()">啟動影像</button>
    <button class="btn btn-audio" id="micBtn" onclick="toggleMic()" disabled>按住對講</button>

    <script>
        let pc;
        let mediaRecorder;

        async function connect() {
            let svr = document.getElementById('urlInput').value.trim();
            if (!svr) return alert("請輸入 ngrok 網址");
            if (svr.endsWith('/')) svr = svr.slice(0, -1);

            const status = document.getElementById('status');
            status.innerText = "正在連線...";

            // 回歸最簡：只用 Google 的 STUN，不強制 Relay
            pc = new RTCPeerConnection({
                iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
            });

            pc.oniceconnectionstatechange = () => {
                status.innerText = "連線狀態: " + pc.iceConnectionState;
                if (pc.iceConnectionState === "connected") {
                    document.getElementById('micBtn').disabled = false;
                }
            };

            pc.ontrack = e => { document.getElementById('v').srcObject = e.streams[0]; };
            pc.addTransceiver('video', { direction: 'recvonly' });

            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                const res = await fetch(`${svr}/api/webrtc?src=pet2`, {
                    method: 'POST',
                    body: offer.sdp
                });
                const answer = await res.text();
                await pc.setRemoteDescription({ type: 'answer', sdp: answer });
            } catch (err) {
                status.innerText = "錯誤: " + err.message;
            }
        }

        async function toggleMic() {
            const svr = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('micBtn');
            
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                btn.innerText = "按住對講";
                return;
            }

            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = e => {
                fetch(`${svr}/upload_audio`, { method: 'POST', body: e.data });
            };
            mediaRecorder.start(200);
            btn.innerText = "對講中...";
        }
    </script>
</body>
</html>
