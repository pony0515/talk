<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luckfox 雙流對講</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        .video-box { width: 100%; max-width: 640px; aspect-ratio: 16/9; background: #000; margin: auto; border-radius: 10px; overflow: hidden; }
        video { width: 100%; height: 100%; }
        button { width: 80%; max-width: 300px; padding: 20px; margin-top: 20px; border-radius: 50px; border: none; background: #3498db; color: white; font-size: 18px; font-weight: bold; cursor: pointer; }
        #logs { font-size: 12px; color: #888; margin-top: 20px; text-align: left; background: #000; padding: 10px; height: 120px; overflow-y: auto; border: 1px solid #333; }
    </style>
</head>
<body>
    <div class="video-box"><video id="video" autoplay playsinline muted></video></div>
    <button id="btnStart">啟動雙向監控</button>
    <div id="logs">>> 系統準備就緒</div>

<script>
    const SERVER_URL = "https://be9c2484fae9.ngrok-free.app"; 
    const videoEl = document.getElementById('video');
    const btnStart = document.getElementById('btnStart');
    const logEl = document.getElementById('logs');

    function addLog(msg) { logEl.innerHTML += `<br>> ${msg}`; logEl.scrollTop = logEl.scrollHeight; }

    async function start() {
        btnStart.disabled = true;
        
        // --- 第一部分：請求影像 (pet2) ---
        try {
            const pcVideo = new RTCPeerConnection();
            pcVideo.addTransceiver('video', { direction: 'recvonly' });
            pcVideo.ontrack = (e) => { videoEl.srcObject = e.streams[0]; addLog("影像已連接"); };
            
            const offerV = await pcVideo.createOffer();
            await pcVideo.setLocalDescription(offerV);
            
            const resV = await fetch(`${SERVER_URL}/api/webrtc?src=pet2`, { method: 'POST', body: offerV.sdp });
            const answerV = await resV.text();
            await pcVideo.setRemoteDescription({ type: 'answer', sdp: answerV });
        } catch (e) { addLog("影像錯誤: " + e.message); }

        // --- 第二部分：發送聲音 (pet2_mic) ---
        try {
            const pcAudio = new RTCPeerConnection();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach(track => pcAudio.addTrack(track, stream));
            
            const offerA = await pcAudio.createOffer();
            await pcAudio.setLocalDescription(offerA);
            
            // 等待 ICE 收集一秒確保穩定
            await new Promise(r => setTimeout(r, 1000));

            addLog("正在發送音訊流...");
            const resA = await fetch(`${SERVER_URL}/api/webrtc?src=pet2_mic`, { method: 'POST', body: pcAudio.localDescription.sdp });
            const answerA = await resA.text();
            await pcAudio.setRemoteDescription({ type: 'answer', sdp: answerA });
            addLog("對講功能已開啟");
        } catch (e) { addLog("聲音錯誤: " + e.message); }
    }

    btnStart.addEventListener('click', start);
</script>
</body>
</html>
