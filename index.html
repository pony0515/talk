<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Luckfox Pro 對講監控</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: white; }
        video { width: 100%; max-width: 600px; background: #000; border-radius: 8px; }
        .controls { margin-top: 20px; display: grid; gap: 10px; justify-content: center; }
        button { padding: 15px 30px; font-size: 16px; cursor: pointer; border-radius: 5px; border: none; }
        .btn-start { background: #28a745; color: white; }
        .btn-audio { background: #007bff; color: white; }
        #status { color: #aaa; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>寵物監視器 (H.264 + 對講)</h2>
    <video id="v" autoplay playsinline muted controls></video>
    <div id="status">準備就緒</div>

    <div class="controls">
        <button class="btn-start" onclick="startConnect()">1. 啟動影像連線</button>
        <button class="btn-audio" id="micBtn" onclick="toggleMic()" disabled>2. 開啟對講 (板子收音)</button>
    </div>

    <script>
        // ！！！請修改成你目前的 ngrok HTTPS 網址 ！！！
        const SVR = "https://ddca383457d7.ngrok-free.app"; 
        
        let pc;
        let mediaRecorder;

        async function startConnect() {
            const status = document.getElementById('status');
            status.innerText = "正在建立連線...";

            pc = new RTCPeerConnection({
                iceServers: [
                    { urls: "stun:stun.l.google.com:19302" },
                    { 
                        urls: "turn:openrelay.metered.ca:443", 
                        username: "openrelayproject", 
                        credential: "openrelayproject" 
                    }
                ]
            });

            pc.oniceconnectionstatechange = () => {
                status.innerText = "連線狀態: " + pc.iceConnectionState;
            };

            pc.ontrack = (e) => {
                document.getElementById('v').srcObject = e.streams[0];
            };

            // 只接收影像
            pc.addTransceiver('video', { direction: 'recvonly' });

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            const res = await fetch(`${SVR}/api/webrtc?src=pet2`, {
                method: 'POST',
                body: offer.sdp
            });
            
            const answer = await res.text();
            await pc.setRemoteDescription({ type: 'answer', sdp: answer });
            
            document.getElementById('micBtn').disabled = false;
        }

        async function toggleMic() {
            const btn = document.getElementById('micBtn');
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                btn.innerText = "2. 開啟對講 (板子收音)";
                btn.style.background = "#007bff";
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                // 使用板子 Python 接收的格式：PCM 16000Hz 16bit 單聲道
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = async (e) => {
                    if (e.data.size > 0) {
                        // 將音訊傳送到 Python receiver2.py (假設它掛在 ngrok 轉發的 8080 埠)
                        // 注意：如果 ngrok 只轉發 1984，這裡需要確保 Python 端也能被連到
                        fetch(`${SVR}/upload_audio`, {
                            method: 'POST',
                            body: e.data
                        });
                    }
                };

                mediaRecorder.start(200); // 每 200ms 發送一次碎片
                btn.innerText = "對講中... (點擊停止)";
                btn.style.background = "#dc3545";
            } catch (err) {
                alert("無法開啟麥克風，請確保使用 HTTPS 網址並允許權限");
            }
        }
    </script>
</body>
</html>
