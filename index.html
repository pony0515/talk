<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luckfox 最終暴力版</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 20px; }
        .video-box { width: 100%; max-width: 640px; aspect-ratio: 16/9; background: #000; margin: auto; border-radius: 10px; overflow: hidden; }
        video { width: 100%; height: 100%; }
        button { width: 80%; max-width: 300px; padding: 20px; margin-top: 20px; border-radius: 50px; border: none; background: #e74c3c; color: white; font-size: 18px; font-weight: bold; cursor: pointer; }
        .log { font-size: 12px; color: #888; margin-top: 20px; text-align: left; background: #000; padding: 10px; height: 100px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="video-box"><video id="video" autoplay playsinline muted></video></div>
    <button id="btnStart">點擊：同步影像與對講</button>
    <div class="log" id="logs">>> 系統等待中</div>

<script>
    const SERVER_URL = "https://be9c2484fae9.ngrok-free.app"; 
    const streamName = "pet2";
    const videoEl = document.getElementById('video');
    const btnStart = document.getElementById('btnStart');
    const logEl = document.getElementById('logs');

    function addLog(msg) { logEl.innerHTML += `<br>> ${msg}`; logEl.scrollTop = logEl.scrollHeight; }

    async function start() {
        btnStart.style.display = 'none';
        try {
            const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

            // 1. 先開啟麥克風
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach(track => pc.addTrack(track, stream));
            addLog("麥克風已就緒");

            // 2. 影像只收，音訊收發
            pc.addTransceiver('video', { direction: 'recvonly' });
            pc.addTransceiver('audio', { direction: 'sendrecv' });

            pc.ontrack = (event) => {
                if (event.track.kind === 'video') {
                    addLog("影像流已到達");
                    videoEl.srcObject = event.streams[0];
                }
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            
            // 等待 ICE 收集 (穩定連線)
            await new Promise(r => setTimeout(r, 1000));

            addLog("正在連接板子...");
            const res = await fetch(`${SERVER_URL}/api/webrtc?src=${streamName}`, {
                method: 'POST',
                body: pc.localDescription.sdp
            });

            const answer = await res.text();
            await pc.setRemoteDescription({ type: 'answer', sdp: answer });
            addLog("連線成功！請大聲對話。");

        } catch (e) {
            addLog("錯誤: " + e.message);
            btnStart.style.display = 'block';
        }
    }
    btnStart.addEventListener('click', start);
</script>
</body>
</html>
