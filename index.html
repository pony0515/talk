<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Luckfox Pro 遠端監控對講系統</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; text-align: center; background: #1a1a1a; color: #eee; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 15px; }
        .controls { display: flex; flex-direction: column; gap: 12px; }
        button { padding: 18px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        .btn-video { background: #28a745; color: white; }
        .btn-audio { background: #007bff; color: white; }
        .btn-audio.recording { background: #dc3545; animation: blink 1s infinite; }
        #status { font-size: 13px; color: #888; margin: 10px 0; padding: 10px; background: #2a2a2a; border-radius: 5px; min-height: 20px; }
        @keyframes blink { 50% { opacity: 0.7; } }
    </style>
</head>
<body>
    <div class="container">
        <h3> Luckfox Pro 寵物監視器 </h3>
        <video id="v" autoplay playsinline muted controls></video>
        <div id="status">系統就緒 (請透過 HTTPS 開啟)</div>

        <div class="controls">
            <button class="btn-video" id="connBtn" onclick="startConnect()">1. 啟動影像連線 (支援 4G/5G)</button>
            <button class="btn-audio" id="micBtn" onclick="toggleMic()" disabled>2. 開啟對講 (手機發聲)</button>
        </div>
    </div>

    <script>
        // SVR 會自動抓取目前 ngrok 的 HTTPS 網址
        const SVR = "https://ddca383457d7.ngrok-free.app"; 
        let pc;
        let mediaRecorder;

        // --- 核心 1: WebRTC 影像連線 ---
        async function startConnect() {
            const statusDiv = document.getElementById('status');
            const connBtn = document.getElementById('connBtn');
            statusDiv.innerText = "連線中 (強制使用 TURN 中繼模式)...";
            connBtn.disabled = true;

            try {
                // 4G 穿透關鍵配置
                const config = {
                    iceServers: [
                        { urls: "stun:stun.l.google.com:19302" },
                        { 
                            urls: "turn:relay.metered.ca:443", 
                            username: "openrelayproject", 
                            credential: "openrelayproject" 
                        }
                    ],
                    // 重要：強制所有流量走 Relay，解決 4G 卡在 checking 的問題
                    iceTransportPolicy: "relay" 
                };

                pc = new RTCPeerConnection(config);

                // 監控連線狀態
                pc.oniceconnectionstatechange = () => {
                    const state = pc.iceConnectionState;
                    statusDiv.innerText = "連線狀態: " + state;
                    console.log("ICE State:", state);
                    if (state === "connected" || state === "completed") {
                        statusDiv.style.color = "#28a745";
                        document.getElementById('micBtn').disabled = false;
                    }
                    if (state === "failed") {
                        statusDiv.style.color = "#dc3545";
                        statusDiv.innerText = "連線失敗，請重新整理網頁";
                        connBtn.disabled = false;
                    }
                };

                // 接收影像軌道
                pc.ontrack = (e) => {
                    console.log("收到影像軌道");
                    document.getElementById('v').srcObject = e.streams[0];
                };

                // 設定只接收影像 (與 go2rtc.yaml 的 #video 對應)
                pc.addTransceiver('video', { direction: 'recvonly' });

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                // 發送 Offer 到 go2rtc API
                const res = await fetch(`${SVR}/api/webrtc?src=pet2`, {
                    method: 'POST',
                    body: offer.sdp
                });
                
                if (!res.ok) throw new Error("伺服器 API 無回應");
                
                const answer = await res.text();
                await pc.setRemoteDescription({ type: 'answer', sdp: answer });
                
            } catch (err) {
                statusDiv.innerText = "錯誤: " + err.message;
                connBtn.disabled = false;
            }
        }

        // --- 核心 2: 麥克風對講 ---
        async function toggleMic() {
            const btn = document.getElementById('micBtn');
            const statusDiv = document.getElementById('status');

            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                btn.innerText = "2. 開啟對講 (手機發聲)";
                btn.classList.remove('recording');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                // 使用板子 Python 能處理的標準 PCM 碎片
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = async (e) => {
                    if (e.data.size > 0) {
                        // 將音訊 POST 到 Python receiver2.py
                        fetch(`${SVR}/upload_audio`, {
                            method: 'POST',
                            body: e.data
                        }).catch(err => console.error("音訊傳送失敗:", err));
                    }
                };

                // 每 200 毫秒傳送一次音訊封包，平衡延遲與負擔
                mediaRecorder.start(200); 
                btn.innerText = "對講中 (點擊停止)";
                btn.classList.add('recording');
            } catch (err) {
                alert("無法開啟麥克風。請確認：\n1. 網址開頭為 https://\n2. 已允許瀏覽器錄音權限");
            }
        }
    </script>
</body>
</html>
