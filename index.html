<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Luckfox 純音訊對講</title>
    <style>
        body { background: #1a1a1a; color: #00ff00; font-family: sans-serif; text-align: center; padding-top: 100px; }
        #status { font-size: 24px; margin: 20px; color: #ff9f43; }
        button { 
            padding: 30px 60px; font-size: 20px; font-weight: bold;
            background: #2ecc71; border: none; border-radius: 50px; 
            color: white; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        button:disabled { background: #95a5a6; }
        .hint { color: #555; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Luckfox 語音傳送測試</h1>
    <div id="status">準備就緒</div>
    <button id="btnStart">點擊開始說話</button>
    <div class="hint">請確認瀏覽器已允許麥克風權限</div>

<script>
    // --- 重要：請在這裡填入你最新的 ngrok 網址 ---
    const SVR_URL = "https://87c22b69e24f.ngrok-free.app"; 

    const btn = document.getElementById('btnStart');
    const status = document.getElementById('status');

    btn.onclick = async () => {
        btn.disabled = true;
        status.innerText = "正在取得麥克風...";

        try {
            // 1. 初始化音訊環境
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const source = audioCtx.createMediaStreamSource(stream);
            
            // 2. 建立處理器 (緩衝區 4096)
            const processor = audioCtx.createScriptProcessor(4096, 1, 1);

            // 3. 建立傳輸流
            const { writable, readable } = new TransformStream();
            const writer = writable.getWriter();

            processor.onaudioprocess = (e) => {
                const input = e.inputBuffer.getChannelData(0);
                const pcm = new Int16Array(input.length);
                // Float32 轉 Int16 PCM
                for (let i = 0; i < input.length; i++) {
                    let s = Math.max(-1, Math.min(1, input[i]));
                    pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                writer.write(pcm.buffer);
            };

            source.connect(processor);
            processor.connect(audioCtx.destination);

            status.innerText = "🔴 正在傳送聲音...";
            status.style.color = "#ff4757";

            // 4. 發起長連接 POST 傳送 PCM 原始數據
            await fetch(SVR_URL, {
                method: 'POST',
                body: readable,
                duplex: 'half' // 這是傳輸流的關鍵設定
            });

            status.innerText = "連線結束";
            status.style.color = "#2ecc71";
            btn.disabled = false;

        } catch (err) {
            status.innerText = "錯誤: " + err.message;
            console.error(err);
            btn.disabled = false;
        }
    };
</script>
</body>
</html>
