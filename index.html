<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Luckfox Pro 遠端監控 (GitHub 版)</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        .card { max-width: 480px; margin: auto; background: #1e1e1e; border-radius: 16px; padding: 20px; }
        video { width: 100%; border-radius: 12px; background: #000; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #333; color: #fff; }
        .btn { width: 100%; padding: 16px; font-size: 18px; border-radius: 12px; border: none; cursor: pointer; margin-bottom: 10px; font-weight: bold; }
        .btn-start { background: #2e7d32; color: white; }
        .btn-mic { background: #1565c0; color: white; }
        #status { color: #ffca28; margin: 10px 0; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h3>🚀 Luckfox 遠端監控</h3>
        
        <input type="text" id="ngrokUrl" placeholder="請輸入 ngrok 網址 (例如: https://xxx.ngrok-free.app)">
        
        <video id="v" autoplay playsinline muted controls></video>
        <div id="status">請輸入網址並點擊啟動</div>

        <button class="btn btn-start" onclick="startConnect()">1. 啟動影像</button>
        <button class="btn btn-mic" id="micBtn" onclick="toggleMic()" disabled>2. 按住對講</button>
    </div>

    <script>
        let pc;
        let mediaRecorder;

        async function startConnect() {
            // 取得使用者輸入的 ngrok 網址
            let svr = document.getElementById('ngrokUrl').value.trim();
            if (!svr) return alert("請先輸入 ngrok 網址！");
            if (svr.endsWith('/')) svr = svr.slice(0, -1); // 移除結尾斜線

            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "連線中 (TCP Relay)...";
            
            const config = {
                iceServers: [{ 
                    urls: "turn:global.metered.ca:443?transport=tcp", 
                    username: "4d22e5629ba194c9fe1ddb7c", 
                    credential: "OYETGRsl0a/CO0wc" 
                }],
                iceTransportPolicy: "relay" 
            };

            pc = new RTCPeerConnection(config);
            pc.oniceconnectionstatechange = () => {
                statusDiv.innerText = "狀態: " + pc.iceConnectionState;
                if (pc.iceConnectionState === "connected") document.getElementById('micBtn').disabled = false;
            };
            pc.ontrack = (e) => { document.getElementById('v').srcObject = e.streams[0]; };
            pc.addTransceiver('video', { direction: 'recvonly' });

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            // 發送到你輸入的 ngrok 網址
            const res = await fetch(`${svr}/api/webrtc?src=pet2`, {
                method: 'POST',
                body: offer.sdp
            });
            const answer = await res.text();
            await pc.setRemoteDescription({ type: 'answer', sdp: answer });
        }

        async function toggleMic() {
            const svr = document.getElementById('ngrokUrl').value.trim();
            const btn = document.getElementById('micBtn');
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                btn.classList.remove('recording');
                return;
            }
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = (e) => {
                fetch(`${svr}/upload_audio`, { method: 'POST', body: e.data });
            };
            mediaRecorder.start(200);
            btn.classList.add('recording');
        }
    </script>
</body>
</html>
