<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luckfox 最終方案</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        .video-box { width: 100%; max-width: 640px; aspect-ratio: 16/9; background: #000; margin: auto; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
        video { width: 100%; height: 100%; object-fit: contain; }
        button { width: 100%; max-width: 300px; padding: 20px; margin-top: 20px; border-radius: 50px; border: none; background: #2ecc71; color: white; font-size: 18px; font-weight: bold; cursor: pointer; }
        #logs { font-size: 12px; color: #2ed573; margin-top: 20px; text-align: left; background: #000; padding: 15px; height: 120px; overflow-y: auto; border: 1px solid #444; font-family: monospace; }
    </style>
</head>
<body>
    <h2>Luckfox 監控對講機</h2>
    <div class="video-box"><video id="video" autoplay playsinline muted></video></div>
    <button id="btnStart">點擊啟動監控與對講</button>
    <div id="logs">>> 系統準備就緒</div>

<script>
    const SERVER_URL = "https://be9c2484fae9.ngrok-free.app"; 
    const videoEl = document.getElementById('video');
    const btnStart = document.getElementById('btnStart');
    const logEl = document.getElementById('logs');

    function addLog(msg) { logEl.innerHTML += `<br>> ${msg}`; logEl.scrollTop = logEl.scrollHeight; }

    async function start() {
        btnStart.disabled = true;
        addLog("正在連接影像...");

        // 1. 影像連線
        try {
            const pcV = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            pcV.addTransceiver('video', { direction: 'recvonly' });
            pcV.ontrack = (e) => { videoEl.srcObject = e.streams[0]; addLog("影像已連通"); };
            const offerV = await pcV.createOffer();
            await pcV.setLocalDescription(offerV);
            const resV = await fetch(`${SERVER_URL}/api/webrtc?src=pet2`, { method: 'POST', body: offerV.sdp });
            const answerV = await resV.text();
            await pcV.setRemoteDescription({ type: 'answer', sdp: answerV });
        } catch (e) { addLog("影像錯誤: " + e.message); }

        // 2. 音訊連線
        try {
            addLog("正在連接音訊並開啟麥克風...");
            const pcA = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true } 
            });
            stream.getTracks().forEach(track => pcA.addTrack(track, stream));

            const offerA = await pcA.createOffer();
            await pcA.setLocalDescription(offerA);
            await new Promise(r => setTimeout(r, 1000)); // 等待 ICE

            const resA = await fetch(`${SERVER_URL}/api/webrtc?src=pet2_mic`, { method: 'POST', body: pcA.localDescription.sdp });
            const answerA = await resA.text();
            await pcA.setRemoteDescription({ type: 'answer', sdp: answerA });
            addLog("對講連線成功！請說話測試");
        } catch (e) { addLog("音訊錯誤: " + e.message); }
    }
    btnStart.addEventListener('click', start);
</script>
</body>
</html>
