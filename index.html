<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Luckfox 影音整合終端</title>
    <style>
        body { background: #000; color: #0f0; text-align: center; font-family: monospace; }
        video { width: 100%; max-width: 500px; border: 1px solid #333; margin-top: 20px; }
        button { padding: 20px; background: #0f0; color: #000; font-weight: bold; cursor: pointer; border-radius: 10px; }
    </style>
</head>
<body>
    <h2>LUCKFOX AIO TERMINAL</h2>
    <video id="v" autoplay playsinline muted></video><br>
    <button id="go">啟動影音監控</button>
    <div id="st">READY</div>

<script>
    const SVR = "https://87c22b69e24f.ngrok-free.app"; 

    document.getElementById('go').onclick = async () => {
        const st = document.getElementById('st');
        st.innerText = "連線中...";

        // 1. 影像 (透過 Python 轉發給 go2rtc)
        try {
            const pc = new RTCPeerConnection();
            pc.addTransceiver('video', { direction: 'recvonly' });
            pc.ontrack = (e) => document.getElementById('v').srcObject = e.streams[0];
            const off = await pc.createOffer();
            await pc.setLocalDescription(off);
            
            const resV = await fetch(`${SVR}/api/webrtc?src=pet2`, { method: 'POST', body: off.sdp });
            await pc.setRemoteDescription({ type: 'answer', sdp: await resV.text() });
            st.innerText = "影像 OK";
        } catch (e) { console.log("影像失敗"); }

        // 2. 聲音 (直接給 Python 播)
        try {
            const audioCtx = new AudioContext({ sampleRate: 16000 });
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const source = audioCtx.createMediaStreamSource(stream);
            const proc = audioCtx.createScriptProcessor(4096, 1, 1);
            source.connect(proc);
            proc.connect(audioCtx.destination);

            proc.onaudioprocess = (e) => {
                const input = e.inputBuffer.getChannelData(0);
                const pcm = new Int16Array(input.length);
                for (let i = 0; i < input.length; i++) {
                    let s = Math.max(-1, Math.min(1, input[i]));
                    pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                fetch(SVR, { method: 'POST', body: pcm.buffer, mode: 'cors' });
            };
            st.innerText = "影音全開中";
        } catch (e) { st.innerText = "音訊錯誤"; }
    };
</script>
</body>
</html>
