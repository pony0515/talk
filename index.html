<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Luckfox Pro 遠端監控中心</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #ffffff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { margin-bottom: 20px; color: #4caf50; }
        
        /* 影像容器 */
        #videoWrapper { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 20px; border: 1px solid #333; }
        iframe { width: 100%; height: 100%; border: none; }

        input { width: 90%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #444; background: #2a2a2a; color: #fff; text-align: center; }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .btn { padding: 16px; font-size: 18px; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; transition: 0.3s; }
        .btn-start { background: #2e7d32; color: white; }
        .btn-mic { background: #1565c0; color: white; }
        .btn:disabled { background: #444; color: #888; cursor: not-allowed; }
        .recording { background: #c62828 !important; animation: blinker 1s linear infinite; }
        
        @keyframes blinker { 50% { opacity: 0.5; } }
        #status { font-size: 14px; margin-top: 15px; color: #ffca28; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎥 遠端監控系統</h2>
        <input type="text" id="ngrokUrl" placeholder="請貼上 ngrok 網址 (https://...)">
        
        <div id="videoWrapper">
            <div style="height: 100%; display: flex; align-items: center; justify-content: center; color: #555;">
                等待連線...
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-start" onclick="connectAll()">1. 啟動遠端影像</button>
            <button class="btn btn-mic" id="micBtn" onclick="toggleMic()" disabled>2. 按住對講</button>
        </div>

        <div id="status">準備就緒</div>
    </div>

    <script>
        let mediaRecorder;
        let svrUrl = "";

        // 啟動連線
        function connectAll() {
            let input = document.getElementById('ngrokUrl').value.trim();
            if (!input) return alert("請輸入 ngrok 網址！");
            if (input.endsWith('/')) input = input.slice(0, -1);
            svrUrl = input;

            const status = document.getElementById('status');
            const wrapper = document.getElementById('videoWrapper');

            status.innerText = "連線建立中...";
            
            // 使用你測試成功的實測路徑嵌入 Iframe
            // 這種方式在 4G 下穩定度最高，且不會有 CORS 報錯
            wrapper.innerHTML = `<iframe src="${svrUrl}/stream.html?src=pet2" allow="autoplay; fullscreen"></iframe>`;
            
            status.innerText = "影像已連接 (4G 模式)";
            status.style.color = "#4caf50";
            document.getElementById('micBtn').disabled = false;
        }

        // 對講功能 (與你之前的 receiver2.py 搭配)
        async function toggleMic() {
            const btn = document.getElementById('micBtn');
            const status = document.getElementById('status');

            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                btn.innerText = "2. 按住對講";
                btn.classList.remove('recording');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = async (e) => {
                    if (e.data.size > 0 && svrUrl) {
                        // 將錄音發送至板子的聲音接收端口 (由 python receiver2.py 處理)
                        fetch(`${svrUrl}/upload_audio`, {
                            method: 'POST',
                            body: e.data
                        }).catch(err => console.error("聲音發送失敗:", err));
                    }
                };

                // 每 200ms 發送一次音訊片段，達到即時對講效果
                mediaRecorder.start(200);
                btn.innerText = "對講中 (點擊結束)";
                btn.classList.add('recording');
            } catch (err) {
                alert("無法開啟麥克風，請確保網址為 HTTPS 並授權權限。");
            }
        }
    </script>
</body>
</html>
