<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Luckfox Pro 遠端監控對講</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: #eee; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; margin-bottom: 15px; }
        .controls { display: flex; flex-direction: column; gap: 12px; }
        button { padding: 16px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        .btn-video { background: #28a745; color: white; }
        .btn-audio { background: #007bff; color: white; }
        .btn-audio.recording { background: #dc3545; }
        #status { font-size: 13px; color: #888; margin: 10px 0; padding: 8px; background: #2a2a2a; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h3>Luckfox Pro 寵物監視器</h3>
        <video id="v" autoplay playsinline muted controls></video>
        <div id="status">系統就緒 (請確保使用 HTTPS)</div>

        <div class="controls">
            <button class="btn-video" onclick="startConnect()">1. 啟動影像連線 (WiFi/4G)</button>
            <button class="btn-audio" id="micBtn" onclick="toggleMic()" disabled>2. 按下對講 (手機發聲)</button>
        </div>
    </div>

    <script>
        // 自動偵測目前的 ngrok 網址
        const SVR = window.location.origin; 
        let pc;
        let mediaRecorder;

        // 【核心函數 1】 影像連線
        async function startConnect() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "正在連線 (正在嘗試穿透 4G 防火牆)...";

            try {
                // WebRTC 配置：加入 TURN 中繼確保 4G 通訊
                const config = {
                    iceServers: [
                        { urls: "stun:stun.l.google.com:19302" },
                        { 
                            urls: "turn:relay.metered.ca:443", 
                            username: "openrelayproject", 
                            credential: "openrelayproject" 
                        }
                    ],
                    // 強制模式：如果 4G 還是 checking，請將下一行註解拿掉
                    // iceTransportPolicy: "relay" 
                };

                pc = new RTCPeerConnection(config);

                pc.oniceconnectionstatechange = () => {
                    statusDiv.innerText = "連線狀態: " + pc.iceConnectionState;
                    if (pc.iceConnectionState === "connected") statusDiv.style.color = "#28a745";
                };

                pc.ontrack = (e) => {
                    document.getElementById('v').srcObject = e.streams[0];
                };

                // 請求影像
                pc.addTransceiver('video', { direction: 'recvonly' });

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                const res = await fetch(`${SVR}/api/webrtc?src=pet2`, {
                    method: 'POST',
                    body: offer.sdp
                });
                
                const answer = await res.text();
                await pc.setRemoteDescription({ type: 'answer', sdp: answer });
                
                document.getElementById('micBtn').disabled = false;
            } catch (err) {
                statusDiv.innerText = "連線失敗: " + err.message;
                console.error(err);
            }
        }

        // 【核心函數 2】 對講功能
        async function toggleMic() {
            const btn = document.getElementById('micBtn');

            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                btn.innerText = "2. 按下對講 (手機發聲)";
                btn.classList.remove('recording');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = async (e) => {
                    if (e.data.size > 0) {
                        // 這裡會把音訊打給 Python 端
                        fetch(`${SVR}/upload_audio`, {
                            method: 'POST',
                            body: e.data
                        }).catch(err => console.error("音訊傳送失敗", err));
                    }
                };

                mediaRecorder.start(200); 
                btn.innerText = "正在對講... (點擊停止)";
                btn.classList.add('recording');
            } catch (err) {
                alert("麥克風啟動失敗！原因：\n1. 網址不是 HTTPS\n2. 沒給麥克風權限");
            }
        }
    </script>
</body>
</html>
