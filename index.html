<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Luckfox 影像+對講整合版</title>
    <style>
        body { background: #121212; color: #00ff00; font-family: monospace; text-align: center; }
        .video-box { width: 100%; max-width: 600px; aspect-ratio: 16/9; background: #000; margin: auto; border: 1px solid #333; }
        video { width: 100%; height: 100%; }
        button { width: 250px; padding: 15px; margin-top: 20px; background: #00ff00; color: #000; font-weight: bold; border: none; cursor: pointer; }
        #logs { margin-top: 20px; color: #666; font-size: 12px; }
    </style>
</head>
<body>
    <h3>LUCKFOX SURVEILLANCE</h3>
    <div class="video-box">
        <video id="video" autoplay playsinline muted></video>
    </div>
    <button id="btnStart">啟動監控與對講</button>
    <div id="logs">>> 系統準備就緒</div>

<script>
    // --- 配置區 ---
    const VIDEO_SVR = "https://你的ngrok_go2rtc網址.ngrok-free.app"; 
    const AUDIO_SVR = "https://你的ngrok_python網址.ngrok-free.app"; 

    const log = (m) => document.getElementById('logs').innerText = ">> " + m;

    document.getElementById('btnStart').onclick = async () => {
        log("正在連線...");

        // 1. 啟動影像 (使用原本通的路徑)
        try {
            const pc = new RTCPeerConnection();
            pc.addTransceiver('video', { direction: 'recvonly' });
            pc.ontrack = (e) => document.getElementById('video').srcObject = e.streams[0];
            const res = await fetch(`${VIDEO_SVR}/api/webrtc?src=pet2`, { 
                method: 'POST', body: (await pc.createOffer()).sdp 
            });
            await pc.setLocalDescription({ type: 'offer', sdp: pc.localDescription.sdp });
            await pc.setRemoteDescription({ type: 'answer', sdp: await res.text() });
            log("影像已連通");
        } catch (e) { console.error("影像失敗", e); }

        // 2. 啟動音訊 (暴力 HTTP 推流)
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const source = audioCtx.createMediaStreamSource(stream);
            const processor = audioCtx.createScriptProcessor(4096, 1, 1);

            const { writable, readable } = new TransformStream();
            const writer = writable.getWriter();

            processor.onaudioprocess = (e) => {
                const input = e.inputBuffer.getChannelData(0);
                const pcm = new Int16Array(input.length);
                for (let i = 0; i < input.length; i++) {
                    pcm[i] = Math.max(-1, Math.min(1, input[i])) * 0x7FFF;
                }
                writer.write(pcm.buffer);
            };

            source.connect(processor);
            processor.connect(audioCtx.destination);

            // 直接 POST 給 Python 接收端
            fetch(AUDIO_SVR, { method: 'POST', body: readable, duplex: 'half' });
            log("影像與對講皆已啟動");
        } catch (e) { log("音訊啟動失敗: " + e.message); }
    };
</script>
</body>
</html>
