<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Luckfox Pro 影音監控</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        .card { max-width: 500px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 15px; }
        #videoBox { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
        iframe { width: 100%; height: 100%; border: none; }
        input { width: 90%; padding: 12px; margin-bottom: 15px; border-radius: 8px; background: #333; color: #fff; border: 1px solid #444; }
        .btn { width: 100%; padding: 15px; font-size: 18px; border-radius: 10px; border: none; cursor: pointer; width: 100%; }
        .btn-start { background: #28a745; color: white; margin-bottom: 10px; }
        .btn-mic { background: #007bff; color: white; }
        .recording { background: #dc3545 !important; }
    </style>
</head>
<body>
    <div class="card">
        <h3>🎥 遠端影音連線</h3>
        <input type="text" id="ngrokUrl" placeholder="請填入 1984 埠的 ngrok 網址">
        <div id="videoBox">影像待機中</div>
        <button class="btn btn-start" onclick="connect()">1. 啟動連線</button>
        <button class="btn btn-mic" id="micBtn" onclick="toggleMic()" disabled>按住對話</button>
    </div>

    <script>
        let recorder;
        let svrUrl = "";

        function connect() {
            let input = document.getElementById('ngrokUrl').value.trim();
            if(!input) return alert("請輸入網址");
            svrUrl = input.endsWith('/') ? input.slice(0,-1) : input;
            
            // 影像直接跟 go2rtc 拿 (WebSocket 會通)
            document.getElementById('videoBox').innerHTML = 
                `<iframe src="${svrUrl}/stream.html?src=pet2" allow="autoplay; microphone"></iframe>`;
            document.getElementById('micBtn').disabled = false;
        }

        async function toggleMic() {
            const btn = document.getElementById('micBtn');
            if (recorder && recorder.state === "recording") {
                recorder.stop();
                btn.innerText = "按住對話";
                btn.classList.remove('recording');
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                recorder = new MediaRecorder(stream);
                recorder.ondataavailable = async (e) => {
                    if (e.data.size > 0 && svrUrl) {
                        // 注意這裡：我們嘗試發送到 Python 的 8080 (這需要你另外啟動 ngrok)
                        // 或者如果你想用同一個 ngrok，請看下方的啟動說明
                        fetch(`${svrUrl}/upload_audio`, { method: 'POST', body: e.data }).catch(()=>{});
                    }
                };
                recorder.start(200);
                btn.innerText = "對話中...";
                btn.classList.add('recording');
            } catch (err) { alert("麥克風錯誤: " + err); }
        }
    </script>
</body>
</html>
