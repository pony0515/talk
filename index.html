<!DOCTYPE html>
<html>
<head>
    <title>Luckfox Talk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <button id="talkBtn" style="width:200px;height:100px;font-size:24px;">點我開始對講</button>
    <p id="status">狀態: 待命</p>

    <script>
        const pc = new RTCPeerConnection();
        const serverUrl = "https://be9c2484fae9.ngrok-free.app"; // 換成你的 ngrok 網址

        document.getElementById('talkBtn').onclick = async () => {
            document.getElementById('status').innerText = "狀態: 請求麥克風...";
            const stream = await navigator.mediaDevices.getUserMedia({audio: true});
            stream.getTracks().forEach(track => pc.addTrack(track, stream));

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            const res = await fetch(`${serverUrl}/api/webrtc?src=pet2`, {
                method: 'POST',
                body: offer.sdp
            });

            const answer = await res.text();
            await pc.setRemoteDescription({type: 'answer', sdp: answer});
            document.getElementById('status').innerText = "狀態: 對講中...";
        };
    </script>
</body>
</html>
