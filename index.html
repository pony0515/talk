<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Luckfox Pro 終極版</title>
    <style>
        body { background: #1a1a1a; color: #eee; text-align: center; font-family: sans-serif; }
        video { width: 95%; max-width: 500px; background: #000; border-radius: 10px; margin: 15px 0; }
        button { padding: 15px; margin: 5px; width: 80%; max-width: 300px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-v { background: #28a745; color: #fff; }
        .btn-a { background: #007bff; color: #fff; }
        #status { font-size: 13px; color: #888; margin-top: 10px; }
    </style>
</head>
<body>
    <h3> Luckfox 監控 (WiFi/4G 自動切換) </h3>
    <video id="v" autoplay playsinline muted controls></video>
    <div id="status">準備就緒</div>
    <button class="btn-v" onclick="startConnect()">1. 啟動影像</button>
    <button class="btn-a" id="micBtn" onclick="toggleTalk()" disabled>2. 開啟對講</button>

    <script>
        // 自動獲取目前的 ngrok 網址或 IP
        const SVR = "https://ddca383457d7.ngrok-free.app";
        let pc;
        let mediaRecorder;

        async function startConnect() {
            document.getElementById('status').innerText = "正在連線...";
            
            // 同時保留 STUN 和 TURN，不強制 relay，讓 WebRTC 決定最快路徑
            pc = new RTCPeerConnection({
                iceServers: [
                    { urls: "stun:stun.l.google.com:19302" },
                    { 
                        // 這是另一組公共 TURN 服務
                        urls: "turn:openrelay.metered.ca:80", 
                        username: "openrelayproject", 
                        credential: "openrelayproject" 
                    }
                ]
            });

            pc.oniceconnectionstatechange = () => {
                const s = pc.iceConnectionState;
                document.getElementById('status').innerText = "狀態: " + s;
                if(s === 'connected' || s === 'completed') {
                    document.getElementById('micBtn').disabled = false;
                }
            };

            pc.ontrack = e => { document.getElementById('v').srcObject = e.streams[0]; };
            pc.addTransceiver('video', { direction: 'recvonly' });

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            
            const res = await fetch(`${SVR}/api/webrtc?src=pet2`, { method: 'POST', body: offer.sdp });
            const answer = await res.text();
            await pc.setRemoteDescription({ type: 'answer', sdp: answer });
        }

        async function toggleTalk() {
            const btn = document.getElementById('micBtn');
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                btn.innerText = "2. 開啟對講";
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (e) => {
                    // 這裡會把聲音打向你板子的 Python 路由
                    fetch(`${SVR}/upload_audio`, { method: 'POST', body: e.data });
                };
                mediaRecorder.start(200); // 每 200ms 發送一次
                btn.innerText = "對講中 (點擊停止)";
            } catch (err) {
                alert("麥克風開啟失敗，請檢查 HTTPS 或權限");
            }
        }
    </script>
</body>
</html>
