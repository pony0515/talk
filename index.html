<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Luckfox MSE 影音整合版</title>
    <style>
        body { background: #000; color: #0f0; text-align: center; font-family: monospace; padding: 20px; }
        .video-container { width: 100%; max-width: 600px; margin: auto; border: 2px solid #333; }
        video { width: 100%; display: block; background: #111; }
        .controls { margin-top: 20px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #27ae60; color: white; border: none; border-radius: 5px; }
        #status { margin-top: 15px; color: #888; }
    </style>
</head>
<body>
    <h2>LUCKFOX REMOTE MONITOR</h2>
    <div class="video-container">
        <video id="videoPlayer" autoplay playsinline muted></video>
    </div>
    <div class="controls">
        <button id="btnStart">啟動影音監控</button>
    </div>
    <div id="status">等待中...</div>

    <script src="https://unpkg.com/hls.js/dist/hls.min.js"></script> <script>
    const SVR = "https://87c22b69e24f.ngrok-free.app"; 
    const video = document.getElementById('videoPlayer');
    const status = document.getElementById('status');

    document.getElementById('btnStart').onclick = async () => {
        status.innerText = "正在連接影像串流...";

        // 1. 影像：使用 MSE 模式 (透過 Python 轉發)
        // go2rtc 的 MSE 路徑通常是 /api/mse.mp4?src=流名稱
        video.src = `${SVR}/api/mse.mp4?src=pet2`;
        
        video.onplaying = () => {
            status.innerText = "影像已連接，正在啟動對講...";
            startAudioPush();
        };

        video.onerror = () => {
            status.innerText = "影像讀取失敗，請檢查 go2rtc 狀態";
        };
    };

    async function startAudioPush() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const source = audioCtx.createMediaStreamSource(stream);
            const processor = audioCtx.createScriptProcessor(4096, 1, 1);

            source.connect(processor);
            processor.connect(audioCtx.destination);

            processor.onaudioprocess = (e) => {
                const input = e.inputBuffer.getChannelData(0);
                const pcm = new Int16Array(input.length);
                for (let i = 0; i < input.length; i++) {
                    let s = Math.max(-1, Math.min(1, input[i]));
                    pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }

                fetch(SVR, {
                    method: 'POST',
                    mode: 'cors',
                    body: pcm.buffer,
                    headers: { 'Content-Type': 'application/octet-stream' }
                }).catch(err => console.error("音訊傳送失敗"));
            };
            status.innerText = "🔴 影音連線中";
            status.style.color = "#ff4757";
        } catch (err) {
            status.innerText = "麥克風啟動失敗: " + err.message;
        }
    }
</script>
</body>
</html>
