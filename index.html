<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Luckfox 4G 監控 (GitHub 版)</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 15px; }
        .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 15px; }
        video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; margin-bottom: 15px; }
        input { width: 90%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #444; background: #333; color: #fff; }
        .btn { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 10px; border: none; cursor: pointer; margin-bottom: 10px; }
        .btn-start { background: #28a745; color: white; }
        #status { font-size: 14px; color: #ffca28; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎥 Luckfox 4G 監控</h2>
        <input type="text" id="ngrokUrl" placeholder="貼上 ngrok 網址 (https://...)">
        <video id="v" autoplay playsinline muted controls></video>
        <div id="status">準備就緒</div>
        <button class="btn btn-start" onclick="startConnect()">啟動遠端影像</button>
    </div>

    <script>
        let pc;

        async function startConnect() {
            let svr = document.getElementById('ngrokUrl').value.trim();
            if (!svr) return alert("請先輸入 ngrok 網址！");
            if (svr.endsWith('/')) svr = svr.slice(0, -1);

            const status = document.getElementById('status');
            status.innerText = "正在連線 (CORS & 4G 優化模式)...";

            // 初始化 WebRTC
            pc = new RTCPeerConnection({
                iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
            });

            pc.oniceconnectionstatechange = () => {
                status.innerText = "連線狀態: " + pc.iceConnectionState;
            };

            pc.ontrack = (e) => {
                document.getElementById('v').srcObject = e.streams[0];
            };

            // 請求影像軌道
            pc.addTransceiver('video', { direction: 'recvonly' });

            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                // 使用 POST 發送 offer 到板子上的 go2rtc
                const res = await fetch(`${svr}/api/webrtc?src=pet2`, {
                    method: 'POST',
                    body: offer.sdp,
                    mode: 'cors' // 強制開啟 CORS 模式
                });

                if (!res.ok) throw new Error("API 請求失敗，請檢查 ngrok 是否有效");

                const answer = await res.text();
                await pc.setRemoteDescription({ type: 'answer', sdp: answer });
                
                status.innerText = "信號已交換，等待畫面...";
            } catch (err) {
                status.innerText = "錯誤: " + err.message;
                console.error(err);
            }
        }
    </script>
</body>
</html>
