<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luckfox 穩定對講</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        .video-box { width: 100%; max-width: 640px; aspect-ratio: 16/9; background: #000; margin: auto; border-radius: 10px; overflow: hidden; }
        video { width: 100%; height: 100%; }
        button { width: 80%; max-width: 300px; padding: 20px; margin-top: 20px; border-radius: 50px; border: none; background: #2ecc71; color: white; font-size: 18px; font-weight: bold; cursor: pointer; }
        .log { font-size: 12px; color: #888; margin-top: 20px; text-align: left; background: #000; padding: 10px; height: 120px; overflow-y: auto; border: 1px solid #333; }
    </style>
</head>
<body>
    <div class="video-box"><video id="video" autoplay playsinline muted></video></div>
    <button id="btnStart">點擊啟動監控與對講</button>
    <div class="log" id="logs">>> 系統準備就緒</div>

<script>
    const SERVER_URL = "https://be9c2484fae9.ngrok-free.app"; 
    const streamName = "pet2";
    const videoEl = document.getElementById('video');
    const btnStart = document.getElementById('btnStart');
    const logEl = document.getElementById('logs');

    function addLog(msg) { logEl.innerHTML += `<br>> ${msg}`; logEl.scrollTop = logEl.scrollHeight; }

    async function start() {
        btnStart.disabled = true;
        try {
            const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

            // 1. 獲取麥克風
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            // 2. 使用 addTrack 加入音軌 (這會自動處理音訊宣告，不要再用 addTransceiver)
            stream.getTracks().forEach(track => pc.addTrack(track, stream));
            addLog("麥克風已就緒並綁定");

            // 3. 影像則使用 recvonly 宣告 (影像只收不發)
            pc.addTransceiver('video', { direction: 'recvonly' });

            pc.ontrack = (event) => {
                if (event.track.kind === 'video') {
                    addLog("收到影像流！");
                    videoEl.srcObject = event.streams[0];
                }
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            
            // 等待一秒讓網路路徑收集完成
            await new Promise(r => setTimeout(r, 1000));

            addLog("正在連接板子...");
            const res = await fetch(`${SERVER_URL}/api/webrtc?src=${streamName}`, {
                method: 'POST',
                body: pc.localDescription.sdp
            });

            if (!res.ok) throw new Error("連線失敗: " + res.status);

            const answer = await res.text();
            // 這裡不再會出現 Duplicate msid 錯誤
            await pc.setRemoteDescription({ type: 'answer', sdp: answer });
            addLog("連線成功！可以開始對講了");

        } catch (e) {
            addLog("錯誤: " + e.message);
            btnStart.disabled = false;
        }
    }
    btnStart.addEventListener('click', start);
</script>
</body>
</html>
