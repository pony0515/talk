<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Luckfox Final Test</title>
    <style>
        body { background: #000; color: #0f0; text-align: center; font-family: monospace; }
        video { width: 80%; border: 1px solid #333; }
        button { padding: 20px; background: #222; color: #0f0; border: 1px solid #0f0; cursor: pointer; }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline muted></video><br>
    <button id="go">點擊啟動監控與對講</button>
    <div id="l">>> 準備就緒</div>

<script>
    const SVR = "https://be9c2484fae9.ngrok-free.app";
    const log = (m) => document.getElementById('l').innerText += "\n" + m;

    document.getElementById('go').onclick = async () => {
        try {
            const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            
            // 強制抓麥克風
            const ms = await navigator.mediaDevices.getUserMedia({ audio: true });
            ms.getTracks().forEach(t => pc.addTrack(t, ms));
            log("麥克風已啟動");

            // 設定影像接收與聲音雙向
            pc.addTransceiver('video', { direction: 'recvonly' });
            pc.ontrack = (e) => { if(e.track.kind === 'video') document.getElementById('v').srcObject = e.streams[0]; };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            
            // 等待 ICE 1.5 秒確保路徑完整
            await new Promise(r => setTimeout(r, 1500));

            log("傳送連線中...");
            const res = await fetch(`${SVR}/api/webrtc?src=pet2`, {
                method: 'POST',
                body: pc.localDescription.sdp
            });

            const answer = await res.text();
            await pc.setRemoteDescription({ type: 'answer', sdp: answer });
            log("連線成功！請對著麥克風大聲吹氣測試");

        } catch (e) { log("錯誤: " + e.message); }
    };
</script>
</body>
</html>
